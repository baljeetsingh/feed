name: Auto Generate Streams Feed

on:
  schedule:
    # Every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Manual one-click run from the Actions tab

permissions:
  contents: write

# Prevent a manual run and a scheduled run from overlapping.
concurrency:
  group: sync-feed
  cancel-in-progress: false

jobs:
  build-and-sync-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Live Streams & Generate streams.json
        env:
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        run: node scripts/sync-feed.mjs

      - name: Commit and Push Updated Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streams.json
          git diff --staged --quiet || (git commit -m "chore(feed): auto-sync stream items [skip ci]" && git push)
