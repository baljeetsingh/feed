name: Auto Generate Streams Feed

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual 1-click run from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-sync-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Streams & Generate streams.json
        run: |
          node -e '
          const fs = require("fs");

          const STACK_OVERFLOW_USER_ID = "1415364";
          const OUTPUT_PATH = "streams.json";

