            "https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1483058712412-4245e9b90334?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1510511459019-5dda7724fd87?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1534972195531-a756b1126975?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1563986768494-4dee2763ff3f?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1517433670267-08bbd4be890f?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&w=1200&q=80"
          ];

          function decodeHtml(html) {
            if (!html) return "";
            return html
              .replace(/&quot;/g, "\"")
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&amp;/g, "&");
          }

          async function runSync() {
            console.log("Fetching Stack Overflow answers for User ID:", STACK_OVERFLOW_USER_ID);
            const res = await fetch(`https://api.stackexchange.com/2.3/users/${STACK_OVERFLOW_USER_ID}/answers?order=desc&sort=votes&site=stackoverflow&pagesize=100`);
            const data = await res.json();
            
            let soItems = [];
            if (data.items && data.items.length) {
              const qIds = [...new Set(data.items.map(a => a.question_id))];
              const qMap = {};
              for (let i = 0; i < qIds.length; i += 50) {
                const batchIds = qIds.slice(i, i + 50).join(";");
                const qRes = await fetch(`https://api.stackexchange.com/2.3/questions/${batchIds}?site=stackoverflow&pagesize=50`);
                const qData = await qRes.json();
                if (qData.items) {
                  qData.items.forEach(q => { qMap[q.question_id] = q; });
                }
              }

              soItems = data.items.map(a => {
                const q = qMap[a.question_id] || {};
                const rawTitle = q.title || `Solution to Question #${a.question_id}`;
                const title = decodeHtml(rawTitle);
                const tags = (q.tags || ["c#", "architecture"]).map(t => t.toUpperCase());
                const score = a.score || 0;
                const votes = score > 0 ? `+${score}` : `${score}`;
                const publishedAt = a.creation_date ? new Date(a.creation_date * 1000).toISOString() : new Date("2014-01-01").toISOString();

                return {
                  type: "stackoverflow",
                  title: title,
                  url: `https://stackoverflow.com/a/${a.answer_id}`,
                  date: "Stack Overflow Solution",
                  publishedAt: publishedAt,
                  votes: votes,
                  score: score,
                  accepted: !!a.is_accepted,
                  snippet: `Verified Stack Overflow solution by Baljeetsingh Sucharia (${votes} votes) covering ${tags.slice(0, 3).join(", ")}.`,
                  labels: tags.slice(0, 3)
                };
              });
            }

            const defaultLinkedInItems = [
              {
                type: "linkedin",
                title: "How to Make Your LinkedIn Profile Stand Out",
                url: "https://blog.baljeetsingh.net/2025/07/how-to-make-your-linkedin-profile-stand.html",
                date: "LinkedIn Article",
                publishedAt: "2025-07-15T10:00:00.000Z",
                snippet: "Key strategies for positioning technical leadership, architecture achievements, and enterprise value on professional profiles.",
                labels: ["Career", "Leadership", "Personal-Brand"]
              },
              {
                type: "linkedin",
                title: "Architecting Bespoke AI Systems: Moving Beyond Off-The-Shelf Model Wrappers",
                url: "https://www.linkedin.com/in/baljeetsingh/recent-activity/articles/",
                date: "LinkedIn Article",
                publishedAt: "2026-01-15T10:00:00.000Z",
                snippet: "Why mission-critical enterprise workflows require deterministic validation, private knowledge retrieval pipelines, and bespoke orchestration instead of generic wrapper tools.",
                labels: ["AI", "Architecture", "Strategy", "Leadership"]
              },
              {
                type: "linkedin",
                title: "Strategic Tech Roadmaps: Transitioning Enterprise Monoliths to Event-Driven Workflows",
                url: "https://www.linkedin.com/in/baljeetsingh/recent-activity/posts/",
                date: "Recent Dispatch",
                publishedAt: "2025-08-20T10:00:00.000Z",
                snippet: "A pragmatic blueprint for engineering leaders modernizing legacy codebases while maintaining continuous delivery SLAs and data consistency.",
                labels: ["Architecture", "Leadership", "DevOps"]
              },
              {
                type: "linkedin",
                title: "The Cognitive Tech Stack: Vector Pipelines, Private Graphs & Knowledge Retrieval",
                url: "https://www.linkedin.com/in/baljeetsingh/recent-activity/articles/",
                date: "Leadership Note",
                publishedAt: "2025-02-10T10:00:00.000Z",
                snippet: "How combining domain ontology graphs with dense vector search delivers zero-hallucination semantic search across petabyte-scale document archives.",
                labels: ["AI", "Data", "Search"]
              }
            ];

            const allItems = [...defaultLinkedInItems, ...soItems];
            allItems.sort((a, b) => {
              const tA = a.publishedAt ? Date.parse(a.publishedAt) : 0;
              const tB = b.publishedAt ? Date.parse(b.publishedAt) : 0;
              return tB - tA;
            });

            allItems.forEach((item, index) => {
              item.cover = UNIQUE_PHOTO_POOL[index % UNIQUE_PHOTO_POOL.length];
            });

            const outputPayload = {
              updatedAt: new Date().toISOString(),
              author: "Baljeetsingh Sucharia",
              totalItems: allItems.length,
              userProfiles: {
                linkedin: "https://www.linkedin.com/in/baljeetsingh/",
                stackoverflow: `https://stackoverflow.com/users/${STACK_OVERFLOW_USER_ID}/baljeetsingh-sucharia`,
                blog: "https://blog.baljeetsingh.net"
              },
              items: allItems
            };

            fs.writeFileSync(OUTPUT_PATH, JSON.stringify(outputPayload, null, 2));
            console.log("Successfully generated", OUTPUT_PATH, "with", allItems.length, "items.");
          }

          runSync();
          '

      - name: Commit and Push Updated Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streams.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(feed): auto-sync stream items [skip ci]" && git push)
